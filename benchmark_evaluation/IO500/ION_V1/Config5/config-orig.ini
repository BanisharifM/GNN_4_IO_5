# Config 5: 4KB random I/O patterns on shared file - FIXED
[global]
datadir = ./datafiles
timestamp-datadir = FALSE
timestamp-resultdir = FALSE
resultdir = ./results
api = POSIX
drop-caches = FALSE
verbosity = 1

[debug]
stonewall-time = 30   # Start with 30s for testing
pause-dir = 

# Disable all easy tests
[ior-easy]
run = FALSE

[ior-easy-write]
run = FALSE

[ior-easy-read]
run = FALSE

# Disable hard tests
[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[ior-hard-read]
run = FALSE

# Disable mdtest
[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdtest-hard-read]
run = FALSE

[mdtest-hard-delete]
run = FALSE

# ENABLE 4K Random tests
[ior-rnd4K]
run = TRUE

[ior-rnd4K-write]
run = TRUE

[ior-rnd4K-read]
run = TRUE

[ior-rnd4K-easy-read]
run = FALSE

# Disable 1MB random
[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

# Disable mdworkbench
[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[mdworkbench-bench]
run = FALSE

[mdworkbench-delete]
run = FALSE

# Disable find
[find-easy]
run = FALSE

[find]
run = FALSE

[find-hard]
run = FALSE