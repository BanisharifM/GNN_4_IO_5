# Config 2: Aligned I/O with 1MB transfers matching Lustre stripe size
[global]
datadir = ./datafiles
timestamp-datadir = FALSE
timestamp-resultdir = FALSE
resultdir = ./results
api = POSIX
drop-caches = FALSE
verbosity = 1

[debug]
stonewall-time = 300  
pause-dir =           

[ior-easy]
transferSize = 1m     # 1MB - optimal for Lustre alignment
blockSize = 100m      # Same as Config 1 for comparison
filePerProc = FALSE   # Shared file (still has contention)
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[ior-easy-read]
run = TRUE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[ior-hard-read]
run = FALSE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdtest-hard-read]
run = FALSE

[mdtest-hard-delete]
run = FALSE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[ior-rnd4K-read]
run = FALSE

[ior-rnd4K-easy-read]
run = FALSE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[mdworkbench-bench]
run = FALSE

[mdworkbench-delete]
run = FALSE

[find-easy]
run = FALSE

[find]
run = FALSE

[find-hard]
run = FALSE