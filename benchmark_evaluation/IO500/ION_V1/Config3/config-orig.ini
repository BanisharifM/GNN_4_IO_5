# Config 3: Optimized configuration with file per process
[global]
datadir = ./datafiles
timestamp-datadir = FALSE
timestamp-resultdir = FALSE
resultdir = ./results
api = POSIX
drop-caches = FALSE
verbosity = 1

[debug]
stonewall-time = 300  
pause-dir =           

[ior-easy]
transferSize = 1m     # 1MB - optimal for Lustre alignment
blockSize = 100m      # Same block size for comparison
filePerProc = TRUE    # KEY DIFFERENCE: Each rank gets its own file (no contention)
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[ior-easy-read]
run = TRUE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[ior-hard-read]
run = FALSE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdtest-hard-read]
run = FALSE

[mdtest-hard-delete]
run = FALSE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[ior-rnd4K-read]
run = FALSE

[ior-rnd4K-easy-read]  
run = FALSE

[ior-rnd1MB]
